name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'linkvault/site_builder.py'
      - 'linkvault/site_index.py'
      - 'linkvault/site_assets/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
  schedule:
    # Self-heal after transient hosted-runner acquisition failures.
    - cron: '0 6,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let the run that already has a runner finish; newer pushes wait their turn.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site from content bundles
        run: |
          rm -rf site
          python3 -m linkvault.site_builder
          touch site/.nojekyll

      - name: Validate build output
        run: |
          test -f site/index.html
          test -f site/assets/home.js
          test "$(find site/d -name index.html | wc -l)" -gt 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
